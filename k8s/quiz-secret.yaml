# Valeurs placeholder, comme le secret de J4 : jamais le vrai mot de passe
# de production dans le repo. A remplacer par "kubectl create secret" ou un
# "kubectl edit secret" sur le cluster reel avant un usage hors exercice.
apiVersion: v1
kind: Secret
metadata:
  name: quiz-secret
  namespace: quiz
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: changeme
