<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz en direct</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center;
      font: 16px/1.5 system-ui, sans-serif; background: #f4f6fa; color: #1b2233;
      padding: 24px;
    }
    main { width: 100%; max-width: 560px; }
    h1 { font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; color: #6b7488; }
    #question { font-size: 1.5rem; margin: 8px 0 24px; }
    button.choix {
      display: block; width: 100%; margin-bottom: 10px; padding: 14px 16px;
      font: inherit; text-align: left; cursor: pointer; border-radius: 10px;
      border: 1px solid #d3d9e4; background: #fff; color: inherit;
      box-shadow: 0 1px 2px rgba(20, 30, 60, .06);
    }
    button.choix:hover:not(:disabled) { border-color: #2f6fed; }
    button.choix:disabled { opacity: .55; cursor: default; box-shadow: none; }
    #pseudo {
      width: 100%; padding: 10px; margin-bottom: 18px; font: inherit;
      border-radius: 8px; border: 1px solid #d3d9e4; background: #fff; color: inherit;
    }
    #verdict { min-height: 1.5em; font-weight: 600; }
    .juste { color: #15803d; }
    .faux { color: #b91c1c; }
    #score { color: #6b7488; margin-top: 20px; }
    /* Navigation entre les deux vues. Meme markup dans les deux pages :
       pas de moteur de template ici, deux fichiers statiques suffisent. */
    .onglets {
      display: flex; gap: 4px; margin-bottom: 22px;
      border-bottom: 1px solid #e2e7f0;
    }
    .onglets a {
      padding: 8px 14px; text-decoration: none; font-size: .9rem;
      color: #6b7488; border-bottom: 2px solid transparent;
    }
    .onglets a:hover { color: #1b2233; }
    .onglets a.actif { color: #2f6fed; border-bottom-color: #2f6fed; font-weight: 600; }
    /* La zone qui dit honnêtement que la donnée manque, au lieu d'une page
       blanche : c'est la dégradation gracieuse, visible à l'écran. */
    #panne { display: none; padding: 14px 16px; border-radius: 10px;
      background: #fdeaea; border: 1px solid #f2b8b8; color: #8f1f1f; }
  </style>
</head>
<body>
  <main>
    <nav class="onglets">
      <a href="/" class="actif">Jouer</a>
      <a href="/animateur">Animateur</a>
    </nav>

    <h1>Quiz en direct</h1>

    <div id="panne">Données indisponibles : le quiz ne répond pas pour le moment.</div>

    <div id="jeu">
      <input id="pseudo" placeholder="Votre pseudo" maxlength="32" autocomplete="off">
      <p id="question">Chargement…</p>
      <div id="choix"></div>
      <p id="verdict"></p>
      <p id="score"></p>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let questionCourante = null;

    function afficherPanne(actif) {
      $('panne').style.display = actif ? 'block' : 'none';
      $('jeu').style.display = actif ? 'none' : 'block';
    }

    async function chargerQuestion() {
      try {
        const reponse = await fetch('/api/question');
        if (!reponse.ok) return afficherPanne(true);

        const { data } = await reponse.json();
        // Une nouvelle manche efface le verdict de la précédente.
        if (!questionCourante || questionCourante.id !== data.id) {
          $('verdict').textContent = '';
          $('verdict').className = '';
        }
        questionCourante = data;
        afficherPanne(false);

        $('question').textContent = data.texte;
        $('choix').innerHTML = '';
        data.choix.forEach((libelle, index) => {
          const bouton = document.createElement('button');
          bouton.className = 'choix';
          bouton.textContent = libelle;
          bouton.onclick = () => repondre(index);
          $('choix').appendChild(bouton);
        });
      } catch {
        afficherPanne(true);
      }
    }

    async function repondre(choix) {
      const pseudo = $('pseudo').value.trim();
      if (!pseudo) return ($('verdict').textContent = 'Entrez un pseudo d’abord.');

      const reponse = await fetch('/api/reponse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pseudo, choix })
      });
      const corps = await reponse.json();

      if (reponse.status === 409) {
        $('verdict').textContent = 'Déjà répondu sur cette manche.';
        $('verdict').className = '';
      } else if (reponse.ok) {
        $('verdict').textContent = corps.data.correcte ? 'Juste !' : 'Raté.';
        $('verdict').className = corps.data.correcte ? 'juste' : 'faux';
      } else {
        $('verdict').textContent = corps.message || 'Réponse refusée.';
        $('verdict').className = '';
      }

      document.querySelectorAll('button.choix').forEach((b) => (b.disabled = true));
      chargerScore(pseudo);
    }

    async function chargerScore(pseudo) {
      try {
        const reponse = await fetch('/api/score/' + encodeURIComponent(pseudo));
        if (!reponse.ok) return;
        const { data } = await reponse.json();
        $('score').textContent = `${data.points} point(s) sur ${data.repondues} réponse(s)`;
      } catch { /* le score est un bonus, son absence ne casse pas la page */ }
    }

    chargerQuestion();
    setInterval(chargerQuestion, 3000);
  </script>
</body>
</html>
