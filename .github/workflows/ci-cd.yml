name: CI/CD

on:
  push:
    branches:
      - '**'

env:
  NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'gabrielmartin09' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quizdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quizdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests against a real PostgreSQL
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: quizdb
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSL: false

  build:
    name: Build & push images
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Seul le nom court figure ici : le compte vient de NAMESPACE.
          - name: quiz-api
            context: .
            dockerfile: ./Dockerfile
          - name: quiz-scores
            context: ./stats_api
            dockerfile: ./stats_api/Dockerfile
          - name: quiz-front
            context: ./front
            dockerfile: ./front/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: contains(fromJSON('["refs/heads/master","refs/heads/develop"]'), github.ref)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ env.NAMESPACE }}/${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # vm-prod tourne sur Apple Silicon (arm64) : sans les deux
          # plateformes, "docker compose pull" y échoue avec "no matching
          # manifest for linux/arm64/v8" alors que l'image existe bien,
          # juste pas pour cette architecture.
          platforms: linux/amd64,linux/arm64
          push: ${{ contains(fromJSON('["refs/heads/master","refs/heads/develop"]'), github.ref) }}
          tags: |
            ${{ env.NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.NAMESPACE }}/${{ matrix.name }}:latest

  deploy:
    name: Deploy to production
    needs: [build]
    if: contains(fromJSON('["refs/heads/master","refs/heads/develop"]'), github.ref)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy key into an SSH agent
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add -
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

      - name: Envoyer la description de la flotte
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /srv/flotte"
          scp -P "$DEPLOY_PORT" docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:/srv/flotte/docker-compose.prod.yml"
          scp -P "$DEPLOY_PORT" prometheus.yml "$DEPLOY_USER@$DEPLOY_HOST:/srv/flotte/prometheus.yml"
          scp -P "$DEPLOY_PORT" -r grafana "$DEPLOY_USER@$DEPLOY_HOST:/srv/flotte/grafana"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Remplacer la flotte
        shell: bash
        run: |
          # On efface les deux lignes avant de les reecrire : plus court
          # qu'un grep-ou-ajoute, et rejouable sans empiler les doublons.
          # REGISTRY part avec TAG pour qu'un "docker compose up" lance a la
          # main sur la cible retombe sur le meme compte que la pipeline.
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /srv/flotte && \
             touch .env && \
             sed -i '/^TAG=/d;/^REGISTRY=/d' .env && \
             printf 'TAG=%s\nREGISTRY=%s\n' '$GITHUB_SHA' '$NAMESPACE' >> .env && \
             docker compose -f docker-compose.prod.yml pull && \
             docker compose -f docker-compose.prod.yml up -d"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Vérifier que la flotte est debout
        shell: bash
        run: |
          check_port() {
            local port="$1"
            for i in $(seq 1 15); do
              if ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "wget -qO- http://localhost:$port/health"; then
                echo "Service sur le port $port en ligne."
                return 0
              fi
              sleep 2
            done
            echo "Aucune réponse sur le port $port après déploiement." >&2
            return 1
          }
          # "api" n'a pas de port hôte fixe (--scale le rendrait impossible) :
          # on vérifie chaque exemplaire par son healthcheck Docker, pas HTTP.
          check_service_healthy() {
            local service="$1"
            for i in $(seq 1 15); do
              statuses=$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                "cd /srv/flotte && docker compose -f docker-compose.prod.yml ps --format '{{.Health}}' $service")
              if [ -n "$statuses" ] && ! echo "$statuses" | grep -qv "^healthy$"; then
                echo "$service : tous les exemplaires healthy."
                return 0
              fi
              sleep 2
            done
            echo "$service n'est pas healthy après déploiement." >&2
            return 1
          }
          check_port 3000 && check_port 8000 && check_service_healthy api
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
