
services:
  api:
    container_name: todo-api
    # ${TAG:-latest} : le sha du commit poussé par la pipeline (voir job
    # deploy), ou "latest" par défaut pour un lancement manuel. C'est ce
    # qui permet un retour arrière : redéployer avec TAG=<sha précédent>.
    image: allanwer/task_api-api:${TAG:-latest}
    # ${PORT:-4000} : valeur par défaut si PORT n'est pas défini dans .env
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file:
      - .env
    depends_on:
      postgres:
        # Attend que Postgres soit vraiment prêt à accepter des connexions,
        # pas seulement que le conteneur ait démarré (voir healthcheck plus bas).
        condition: service_healthy
    networks:
      - tasknetwork
    restart: unless-stopped

  postgres:
    container_name: todo-db
    image: postgres:16.4-alpine
    env_file:
      - .env
    volumes:
      - taskvolume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tasknetwork
    restart: unless-stopped
    # Volontairement AUCUN "ports:" ici : Postgres ne doit être joignable
    # que par les autres conteneurs du network, jamais depuis la machine hôte

  stats-api:
    container_name: todo-stats-api
    image: allanwer/task_api-stats-api:${TAG:-latest}
    networks:
      - tasknetwork  
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8000:8000"

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - tasknetwork
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:11.2.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - tasknetwork
    ports:
      # Port hôte 3001 (3000 documenté dans le sujet) : libre ici, l'API
      # de ce projet écoute déjà sur 4000.
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped


networks:
  # Network custom nommé : active la résolution DNS par nom de service
  # (api -> postgres), contrairement au bridge par défaut de Docker.
  tasknetwork:
    name: tasknetwork
    external: true

volumes:
  taskvolume:
  prometheus-data:
  grafana-data: